<style>
   body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: linear-gradient(135deg,#4c6ef5,#2ec4b6);
  min-height: 100vh;
}

/* Titles */

.main-title {
  text-align: center;
  margin-top: 30px;
  color: white;
}

.page-title {
  text-align: center;
  margin-top: 10px;
  color: #e0f7fa;
}

/* Card Layout */

.card-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 25px;
  margin: 40px;
}

/* Card Style */

.card {
  display: block;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(12px);
  padding: 30px;
  border-radius: 20px;
  text-decoration: none;
  color: white;
  text-align: center;
  transition: 0.4s;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

/* Icons */

.card-icon {
  font-size: 36px;
  margin-bottom: 10px;
}

/* Hover Glow */

.card:hover {
  transform: translateY(-8px) scale(1.05);
  background: rgba(255,255,255,0.25);
  box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}

/* Back Home */

.back-home {
  display: block;
  text-align: center;
  margin: 30px;
  text-decoration: none;
  color: white;
  font-weight: bold;
}
</style>
